name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            comments-service/package-lock.json
            package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true
      - run: python -m venv .venv-importer
      - run: .venv-importer/bin/pip install -r importer/requirements.txt
      - run: npm ci
      - run: npm --prefix comments-service ci
      - run: npm run comments:init
      - run: npm run check
      - name: 确认CI不含生产连接
        run: |
          if git grep -n -E 'ssh +[^ ]+@|COS_SECRET|BEGIN PRIVATE KEY' -- \
            '.github' ':!.github/workflows/ci.yml'; then
            echo 'CI配置包含生产连接或敏感字段。' >&2
            exit 1
          fi
