name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            comments-service/package-lock.json
            package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true
      - run: python -m venv .venv-importer
      - run: .venv-importer/bin/pip install -r importer/requirements.txt
      - run: npm ci
      - run: npm --prefix comments-service ci
      - run: npm run comments:init
      - run: npm run check
      - name: 确认CI不含生产连接
        run: |
          if git grep -n -E 'ssh +[^ ]+@|COS_SECRET|BEGIN PRIVATE KEY' -- \
            '.github' ':!.github/workflows/ci.yml'; then
            echo 'CI配置包含生产连接或敏感字段。' >&2
            exit 1
          fi

  # Windows：原生 PowerShell + Node.js 流程，无 WSL、无 Bash。
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            comments-service/package-lock.json
            package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true
      - run: python -m venv .venv-importer
      - run: .venv-importer/Scripts/pip install -r importer/requirements.txt
      - run: npm ci
      - run: npm --prefix comments-service ci
      - run: npm run comments:init
      # 跨平台核心检查（Node 检查集 + Python 测试 + Hugo 构建 + PowerShell 语法）
      - run: npm run check
      # setup.ps1 只读预检模式
      - shell: pwsh
        run: |
          $env:LIDAIJI_PYTHON = (Join-Path $env:GITHUB_WORKSPACE '.venv-importer\Scripts\python.exe')
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\setup.ps1 -CheckOnly
      # 中文 + 空格路径：复制仓库到临时目录后运行核心 Node 测试与 PowerShell 语法检查
      - shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP '历代纪 测试'
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          robocopy $env:GITHUB_WORKSPACE $dest /E /XD .git node_modules .venv-importer /NFL /NDL /NJH /NJS /NP | Out-Null
          Push-Location $dest
          try {
            node tests/check-source.mjs
            node tests/check-editor-markdown.mjs
            $files = Get-ChildItem scripts\windows -Filter *.ps1
            foreach ($f in $files) {
              $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
              if ($errs.Count -gt 0) { throw "PowerShell 语法错误：$($f.Name)" }
            }
          } finally {
            Pop-Location
          }
      # Windows 后台启动 Studio 冒烟：启动 → 健康检查 → 停止
      - shell: pwsh
        run: |
          $env:LIDAIJI_PYTHON = (Join-Path $env:GITHUB_WORKSPACE '.venv-importer\Scripts\python.exe')
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\start-studio.ps1
          Start-Sleep -Seconds 2
          if (-not (Test-NetConnection -ComputerName 127.0.0.1 -Port 4173 -InformationLevel Quiet -WarningAction SilentlyContinue)) {
            throw 'Studio 未监听 4173'
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\status-studio.ps1
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\scripts\windows\stop-studio.ps1

  # Linux：核心 Node 测试 + 构建 + 部署脚本语法
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            comments-service/package-lock.json
            package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true
      - run: python -m venv .venv-importer
      - run: .venv-importer/bin/pip install -r importer/requirements.txt
      - run: npm ci
      - run: npm --prefix comments-service ci
      - run: npm run comments:init
      # Linux 上 check 走 scripts/check.sh（既有全套）；跳过浏览器冒烟（无 Chrome/演示依赖时自动跳过）
      - run: HUGO_BIN=hugo npm run check
      - run: bash -n scripts/*.sh deploy/*.sh
