name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: comments-service/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true
      - run: python -m venv .venv-importer
      - run: .venv-importer/bin/pip install -r importer/requirements.txt
      - run: npm --prefix comments-service ci
      - run: npm run comments:init
      - run: npm run check
      - name: 确认CI不含生产连接
        run: |
          ! grep -R -E 'ssh +[^ ]+@|COS_SECRET|BEGIN PRIVATE KEY' .github
