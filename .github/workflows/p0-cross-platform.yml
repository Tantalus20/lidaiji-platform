name: p0-cross-platform

# P0-A+B 跨平台验收专用：仅在本功能分支触发；只读权限，无任何部署步骤。
on:
  push:
    branches:
      - p0/workspace-snapshot

permissions:
  contents: read

jobs:
  windows-protocol:
    name: Windows build + snapshot protocol
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true
      - run: python -m venv .venv-importer
      - run: .venv-importer/Scripts/pip install -r importer/requirements.txt
      - run: npm ci
      - run: npm --prefix comments-service ci
      - run: npm run comments:init
      - name: 记录工具链版本
        shell: pwsh
        run: |
          node --version
          python --version
          git --version
          hugo version
          git rev-parse HEAD
      - name: Windows 原生构建（跨平台入口）
        run: node scripts/cross-platform/build.mjs
      - name: 校验 BUILD_INFO 与 release snapshot 协议
        shell: pwsh
        run: |
          $head = (git rev-parse HEAD).Trim()
          $infoPath = Join-Path $env:GITHUB_WORKSPACE 'dist/site/BUILD_INFO'
          if (-not (Test-Path $infoPath)) { throw 'BUILD_INFO missing' }
          $info = Get-Content $infoPath -Raw
          foreach ($key in @('releaseSnapshotId','releaseSnapshotFingerprint','snapshotMode','contentManifestSha256','configFingerprint','builderVersion','sourceCommit')) {
            if ($info -notmatch "(?m)^$($key): .+$") { throw "BUILD_INFO missing $key" }
          }
          if ($info -notmatch "(?m)^snapshotMode: full_site$") { throw 'snapshotMode mismatch' }
          if ($info -notmatch "(?m)^sourceCommit: $head$") { throw 'sourceCommit mismatch' }
          $snap = Get-ChildItem (Join-Path $env:GITHUB_WORKSPACE '.cache/releases') -Directory |
            Where-Object { $_.Name -notlike '.*' } | Select-Object -First 1
          if (-not $snap) { throw 'release snapshot missing' }
          .venv-importer\Scripts\python tools/release_snapshot.py verify --snapshot $snap.FullName
      - name: Windows workspace/snapshot 契约测试
        run: |
          .venv-importer\Scripts\python tests/test_workspace_resolution.py
          .venv-importer\Scripts\python tests/test_release_snapshot.py
      # 中文+空格路径与路径规范化由规范 ci.yml 的 Windows job 覆盖（Node 源码检查
      # + PowerShell 语法），build.mjs 的 ROOT 固定取自模块路径，无需在此重复构建。

  linux-identity:
    name: Linux identity rejection + full regression
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.162.0'
          extended: true
      - run: python -m venv .venv-importer
      - run: .venv-importer/bin/pip install -r importer/requirements.txt
      - run: npm ci
      - run: npm --prefix comments-service ci
      - run: npm run comments:init
      - name: 记录工具链版本
        run: |
          node --version
          python3 --version
          git --version
          hugo version
          bash --version | head -1
          git rev-parse HEAD
      - name: 发布身份校验拒绝套件（真实执行 verify-release-identity.sh）
        run: bash tests/check-release-identity.sh
      - name: 跨平台核心检查（Node + Python + Hugo + Linux shell 安全）
        run: npm run check
      - name: 校验 Linux 构建产物与快照协议
        run: |
          head="$(git rev-parse HEAD)"
          grep -q "^sourceCommit: $head$" dist/site/BUILD_INFO
          grep -q "^snapshotMode: full_site$" dist/site/BUILD_INFO
          snapshot="$(find .cache/releases -maxdepth 1 -mindepth 1 -type d -not -name '.*' | head -1)"
          test -n "$snapshot"
          .venv-importer/bin/python tools/release_snapshot.py verify --snapshot "$snapshot"
