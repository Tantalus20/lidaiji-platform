{{ define "main" }}
<header class="page-header">
  <h1>{{ .Title }}</h1>
  <p>{{ .Description }}</p>
</header>
<div class="page-shell timeline">
  {{ range .Site.RegularPages.GroupByDate "2006" }}
    <section>
      <h2>{{ .Key }}年</h2>
      <ol>
        {{ range .Pages.ByDate.Reverse }}
          <li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "01月02日" }}</time><a href="{{ .RelPermalink }}">{{ .Title }}</a><span>{{ .CurrentSection.Title }}</span></li>
        {{ end }}
      </ol>
    </section>
  {{ end }}
</div>
{{ end }}
